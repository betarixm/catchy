{% extends "base.html" %}

{% block title %}Sign in — Catchy{% endblock %}

{% block container_class %}container-narrow{% endblock %}

{% block content %}
  <section class="login-hero center">
    <div class="reveal">
      <h1 class="display mt-2">
        Welcome <em>back</em>.
      </h1>
      <p class="lead mt-3" style="margin-left: auto; margin-right: auto;">
        Pick up where you left off.
      </p>
    </div>

    <form method="post" class="editorial reveal" style="margin: 56px auto 0; max-width: 380px; text-align: left;">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 12px;">
        Continue →
      </button>
    </form>
  </section>

  <style>
    .login-hero { padding: 72px 0 32px; }
    .login-hero .display { text-align: center; }
    .login-hero .lead { max-width: 520px; text-align: center; }
    @media (max-width: 720px) {
      .login-hero { padding-top: 48px; }
    }
  </style>
{% endblock %}
