{% extends "base.html" %}

{% block title %}404 — Catchy{% endblock %}

{% block content %}
  <section class="error-hero">
    <div class="reveal">
      <span class="error-code">404</span>
      <h1 class="display">
        Not <em>found</em>.
      </h1>
      <p class="lead">
        This page doesn't exist — or it never did.
        {% if request_path %}
          The path <code>{{ request_path }}</code> didn't match anything we know about.
        {% endif %}
      </p>
      <div class="row">
        <a class="btn btn-primary" href="{% url 'ctf:index' %}">Back to home</a>
        <a class="btn-bare" href="javascript:history.back()">← Go back</a>
      </div>
    </div>
  </section>
{% endblock %}
